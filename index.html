      @font-face {

      /* Studio splash (Frost Glow Games): Ursa Major constellation drawn in SVG + CSS animation, shown before the game scripts load. */
      #studio-splash {
        position: fixed; inset: 0; z-index: 100; overflow: hidden; cursor: pointer;
        background: radial-gradient(ellipse at 50% 40%, #10243c 0%, #071121 55%, #02050b 100%);
        display: flex; align-items: center; justify-content: center;
      }
      #studio-splash .fg-art { width: min(90vw, 110vmin); aspect-ratio: 4 / 3; opacity: 0; }
      #studio-splash .fg-art svg { display: block; width: 100%; height: 100%; overflow: visible; }
      #studio-splash svg * { transform-box: fill-box; transform-origin: center; }
      #studio-splash .fg-line { stroke-dasharray: 1 1; stroke-dashoffset: 1; stroke-opacity: 0.7; }
      #studio-splash .fg-ptr { stroke-dasharray: 0.04 0.03; stroke-dashoffset: 0; opacity: 0; stroke: #ffc98a; }
      #studio-splash .fg-star, #studio-splash .fg-polar { opacity: 0; transform: scale(0); }
      #studio-splash .fg-glow, #studio-splash .fg-txt { opacity: 0; }
      #studio-splash .fg-bgs circle { opacity: 0.2; }
      #studio-splash.go .fg-art { animation: fg-fade 3.9s ease-in-out forwards; }
      #studio-splash.go { animation: fg-out 0.3s ease-in 3.9s forwards; }
      #studio-splash.go .fg-glow { animation: fg-show 1.5s ease-out 0.1s forwards; }
      #studio-splash.go .fg-star { animation: fg-starin 0.5s cubic-bezier(.2,1.4,.4,1) var(--d) forwards; }
      #studio-splash.go .fg-tw { animation: fg-tw 2.6s ease-in-out infinite; animation-duration: var(--t); }
      #studio-splash.go .fg-line { animation: fg-draw 0.3s ease-out var(--d) forwards; }
      #studio-splash.go .fg-ptr { animation: fg-ptr 0.5s ease-out var(--d) forwards; }
      #studio-splash.go .fg-polar { animation: fg-starin 0.6s cubic-bezier(.2,1.4,.4,1) var(--d) forwards; }
      #studio-splash.go .fg-fl { animation: fg-flick 0.8s linear infinite; }
      #studio-splash.go .fg-fl2 { animation: fg-flick 0.55s linear infinite reverse; }
      #studio-splash.go .fg-fl-glow { animation: fg-flare 1.15s ease-in-out infinite; }
      #studio-splash.go .fg-bgs circle { animation: fg-bgtw 2.4s ease-in-out infinite alternate; animation-duration: var(--t); }
      #studio-splash.go .fg-txt { animation: fg-txt 0.8s ease-out 1.2s forwards; }
      #studio-splash.go .fg-txt2 { animation-delay: 1.5s; }
      #studio-splash.skip { animation: fg-out 0.25s ease-in forwards !important; }
      @keyframes fg-fade { 0% { opacity: 0; } 10% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes fg-show { to { opacity: 1; } }
      @keyframes fg-starin { to { opacity: 1; transform: scale(1); } }
      @keyframes fg-tw { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.75; transform: scale(0.88); } }
      @keyframes fg-bgtw { from { opacity: 0.12; } to { opacity: 0.7; } }
      @keyframes fg-draw { to { stroke-dashoffset: 0; } }
      @keyframes fg-ptr { to { opacity: 0.8; } }
      @keyframes fg-flick { 0%, 100% { transform: scale(1, 1) rotate(0deg); } 12% { transform: scale(0.9, 1.1) rotate(4deg); } 27% { transform: scale(1.08, 0.92); } 41% { transform: scale(0.94, 1.12) rotate(-4deg); } 58% { transform: scale(1.05, 0.95); } 73% { transform: scale(0.92, 1.07) rotate(2deg); } }
      @keyframes fg-flare { 0%, 100% { opacity: 0.75; transform: scale(1); } 20% { opacity: 1; transform: scale(1.15); } 45% { opacity: 0.6; transform: scale(0.92); } 70% { opacity: 0.95; transform: scale(1.1); } }
      @keyframes fg-txt { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes fg-out { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #studio-splash.go *, #studio-splash.go { animation-duration: 0.01s !important; animation-delay: 0s !important; }
        #studio-splash.go .fg-tw, #studio-splash.go .fg-fl, #studio-splash.go .fg-fl2, #studio-splash.go .fg-fl-glow, #studio-splash.go .fg-bgs circle { animation: none !important; }

        #studio-splash.go .fg-art { animation: fg-fade 1.9s ease-in-out forwards !important; }
      }

    <script>
      // Boot screen in the player's language (saved setting, else the browser language).
      (function () {
        var lang = null;
        try {
          var s = JSON.parse(localStorage.getItem('deliverychaos.settings') || 'null');
          if (s && (s.language === 'ru' || s.language === 'en' || s.language === 'zh')) lang = s.language;
        } catch (e) {}
        if (!lang) {
          var n = (navigator.language || '').toLowerCase();
          lang = n.indexOf('zh') === 0 ? 'zh' : n.indexOf('ru') === 0 ? 'ru' : 'en';
        }
        var t = { ru: ['Drop & Deliver: Chaos!', 'Загрузка…'], en: ['Drop & Deliver: Chaos!', 'Loading…'], zh: ['Drop & Deliver: Chaos!', '加载中…'] }[lang];
        var img = document.querySelector('#boot-screen img');
        img.src = 'logo/drop-deliver-chaos.png';
        img.alt = t[0];
        document.querySelector('#boot-screen .boot-text').textContent = t[1];
        document.title = t[0];
      })();
    </script>
    <script>
      // Studio splash: starts once the logo art is loaded, tap / click / any key skips it, removed when done.
      (function () {
        var el = document.getElementById('studio-splash');
        if (!el) return;
        try { if (sessionStorage.getItem('deliverychaos.noSplash') === '1') { sessionStorage.removeItem('deliverychaos.noSplash'); el.parentNode.removeChild(el); return; } } catch (e) {}
        var done = false;
        var remove = function () {
          if (done) return;
          done = true;
          if (el.parentNode) el.parentNode.removeChild(el);
        };
        var skip = function () {
          if (done) return;
          el.classList.add('skip');
          setTimeout(remove, 300);
        };
        var started = false;
        var start = function () {
          if (started || done) return;
          started = true;
          el.classList.add('go');
          setTimeout(remove, 4700);
        };
        start();
        el.addEventListener('animationend', function (e) { if (e.target === el) remove(); });
        el.addEventListener('pointerdown', skip);
        window.addEventListener('keydown', function k() { window.removeEventListener('keydown', k); skip(); });
      })();
    </script>
